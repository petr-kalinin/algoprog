name: Build and deploy algoprog to Selectel

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

concurrency:
  group: selectel-algoprog
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/petr-kalinin/algoprog:master-latest
            ghcr.io/petr-kalinin/algoprog:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/petr-kalinin/algoprog:master-latest
          cache-to: type=inline

      - name: Install kubectl
        uses: azure/setup-kubectl@v5.1.0
        with:
          version: v1.35.3

      - name: Preload image and deploy
        env:
          SELECTEL_KUBECONFIG_B64: ${{ secrets.SELECTEL_KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "$SELECTEL_KUBECONFIG_B64"

          current_sha="$(git ls-remote origin refs/heads/master | cut -f1)"
          test -n "$current_sha"
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            echo "A newer master commit exists; skipping this deployment."
            exit 0
          fi

          umask 077
          export KUBECONFIG="$RUNNER_TEMP/selectel-kubeconfig"
          printf '%s' "$SELECTEL_KUBECONFIG_B64" | base64 --decode > "$KUBECONFIG"
          trap 'rm -f "$KUBECONFIG"' EXIT

          image="ghcr.io/petr-kalinin/algoprog:$GITHUB_SHA"
          kubectl -n default set image daemonset/nodejs-image-cache image-cache="$image"
          kubectl -n default rollout status daemonset/nodejs-image-cache --timeout=30m

          current_sha="$(git ls-remote origin refs/heads/master | cut -f1)"
          test -n "$current_sha"
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            echo "A newer master commit arrived during the image pull; skipping this deployment."
            exit 0
          fi

          kubectl -n default set image deployment/nodejs nodejs="$image"
          kubectl -n default rollout status deployment/nodejs --timeout=15m

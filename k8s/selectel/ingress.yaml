apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: algoprog-ingress
  annotations:
    cert-manager.io/issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - algoprog.ru
        - www.algoprog.ru
      secretName: algoprog-ru-tls
    - hosts:
        - algoprog.org
        - www.algoprog.org
      secretName: algoprog-org-tls
    - hosts:
        - notes.algoprog.ru
        - notes.algoprog.org
      secretName: algoprog-notes-tls
  rules:
    - host: algoprog.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nodejs
                port:
                  number: 3000
    - host: www.algoprog.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nodejs
                port:
                  number: 3000
    - host: algoprog.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nodejs
                port:
                  number: 3000
    - host: www.algoprog.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nodejs
                port:
                  number: 3000
    - host: notes.algoprog.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: progtexts2
                port:
                  number: 80
    - host: notes.algoprog.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: progtexts2
                port:
                  number: 80

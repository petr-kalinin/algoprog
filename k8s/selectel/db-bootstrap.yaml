# Temporary, private MongoDB instance for restoring the complete archive.
# Apply k8s/selectel/db-deployment.yaml after restore to enable authentication.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  labels:
    io.kompose.service: db
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/app-network: "true"
        io.kompose.service: db
    spec:
      containers:
        - name: db
          image: mongo:4.1.8-xenial
          args:
            - --bind_ip
            - 127.0.0.1
            - --wiredTigerCacheSizeGB
            - "0.5"
          ports:
            - containerPort: 27017
              name: mongo
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
